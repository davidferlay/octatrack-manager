name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'user-guide/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm --dir user-guide install --frozen-lockfile

      - name: Optimize images
        run: pnpm --dir user-guide run optimize-images

      - name: Build user guide
        run: pnpm --dir user-guide run build

      - name: Generate PDF user guide
        working-directory: user-guide
        run: |
          pnpm exec docusaurus serve --port 3030 --no-open &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -s http://localhost:3030/masterocta/docs/intro > /dev/null 2>&1 && break
            sleep 1
          done
          pnpm exec docs-to-pdf docusaurus \
            --initialDocURLs "http://localhost:3030/masterocta/docs/intro" \
            --contentSelector "article" \
            --paginationSelector "a.pagination-nav__link--next" \
            --excludeSelectors ".margin-vert--xl a,[class^='tocCollapsible'],.breadcrumbs,.theme-edit-this-page" \
            --coverImage "http://localhost:3030/masterocta/img/logo-512.png" \
            --coverTitle "MasterOCTa" \
            --coverSub "User Guide" \
            --paperFormat "A4" \
            --pdfMargin "60,50,60,50" \
            --outputPDFFilename "build/masterocta-user-guide.pdf" \
            --puppeteerArgs "--no-sandbox" \
            --disableTOC
          kill $SERVER_PID 2>/dev/null || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: user-guide/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
