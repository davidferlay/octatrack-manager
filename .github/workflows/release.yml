name: Prod Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (semver, e.g. 0.2.0)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--target x86_64-unknown-linux-gnu'
            rust_targets: ''
          - platform: ubuntu-24.04-arm
            args: '--target aarch64-unknown-linux-gnu'
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: '--target aarch64-pc-windows-msvc'
            rust_targets: 'aarch64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies (Ubuntu)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm --filter octatrack-manager install --frozen-lockfile

      - name: Update version
        shell: bash
        run: |
          # Use input version for workflow_dispatch, or extract from tag for release events
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF_NAME#v}
          fi
          echo "Setting version to $VERSION"

          # Update Cargo.toml
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

          # Update tauri.conf.json
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json

          # Show the changes
          echo "Updated Cargo.toml:"
          grep "^version" src-tauri/Cargo.toml
          echo "Updated tauri.conf.json:"
          grep "\"version\"" src-tauri/tauri.conf.json

      - name: Build and upload artifacts (Ubuntu)
        if: contains(matrix.platform, 'ubuntu')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 1
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

      - name: Build and upload artifacts (Windows/macOS)
        if: ${{ !contains(matrix.platform, 'ubuntu') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

  # Uploading assets can leave the release drafted; force-publish it once every build
  # finishes so a prod release is never left as a draft. Only runs for the release
  # event (manual workflow_dispatch has no release payload to publish).
  publish-release:
    needs: build-tauri
    if: ${{ github.event.release.id }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release (undraft)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              draft: false,
            });
            core.info('Release published (draft=false)');
