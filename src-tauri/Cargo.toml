[workspace]
members = [
    ".",
    "crates/ot-domain",
    "crates/ot-codec",
    "crates/ot-codec-ports",
    "crates/ot-storage-ports",
    "crates/ot-application",
    "crates/ot-catalog",
    "crates/ot-audio",
    "crates/ot-plan",
    "crates/ot-backup",
    "crates/ot-executor",
]
resolver = "2"

[package]
name = "masterocta"
version = "0.1.0"
description = "MasterOCTa — a desktop application for safely managing Elektron Octatrack projects"
authors = ["dferlay"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "masterocta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ot-tools-io = { git = "https://gitlab.com/davidferlay/ot-tools-io.git", rev = "cd246d8a595647364eb4cc78211033b2d1302526" }
sysinfo = "0.32"
trash = "5"
walkdir = "2"
fs2 = "0.4"
dirs = "5"
hound = "3.5"
aifc = "0.6"
open = "5"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "aac", "wav", "aiff"] }
rubato = "0.15"
once_cell = "1.19"
chrono = "0.4"
encoding_rs = "0.8"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
libc = "=0.2.182"
ot-application = { path = "crates/ot-application" }
ot-audio = { path = "crates/ot-audio" }
ot-catalog = { path = "crates/ot-catalog" }
ot-domain = { path = "crates/ot-domain" }
ot-executor = { path = "crates/ot-executor" }
ot-plan = { path = "crates/ot-plan" }
ot-storage-ports = { path = "crates/ot-storage-ports" }

[dev-dependencies]
tempfile = "3"
